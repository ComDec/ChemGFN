# Configuration for automatic template config generation
# This file controls which model configs are used to generate experiment templates

# Model configs to generate templates from
# Each entry specifies a model config and the output template settings
generate:
  llama3_expr24:
    enabled: true
    output_template: "configs/experiment/templates/template_expr24.yaml"
    description: "Template for 24-points experiments"
    default_tags: ["ChemGFN", "expr24", "template"]

  llama3_smiles_opt:
    enabled: true
    output_template: "configs/experiment/templates/template_smiles_opt.yaml"
    description: "Template for SMILES optimization"
    default_tags: ["ChemGFN", "smiles", "optimization", "template"]

  llama3_smiles:
    enabled: false  # Set to false to skip
    output_template: "configs/experiment/templates/template_smiles.yaml"
    description: "Template for SMILES generation"
    default_tags: ["ChemGFN", "smiles", "template"]

# Model configs to ignore completely
ignore:
  - "_template.yaml"
  - "test.yaml"
  - "gpt2.yaml"  # Old models
  - "gpt2_uniform.yaml"

# Global settings
settings:
  # Create template directory if it doesn't exist
  create_template_dir: true

  # Backup existing templates before overwriting
  backup_existing: true

  # Add generation timestamp to templates
  add_timestamp: true

  # Comment prefix for generated files
  comment_header: |
    # AUTO-GENERATED TEMPLATE CONFIG
    # Generated from: {source_config}
    # Generation time: {timestamp}
    # DO NOT EDIT THIS FILE DIRECTLY - Edit the source config and regenerate

  # Fields to mark as "CUSTOMIZE" in templates
  customize_fields:
    - exp_name
    - seed
    - tags
    - trainer.max_epochs
    - model.optimizer.lr
    - logger.wandb.project

# Post-generation hooks
post_generation:
  # Run black formatter on generated files
  format_with_black: false

  # Validate generated YAML
  validate_yaml: true

  # Print summary after generation
  print_summary: true
