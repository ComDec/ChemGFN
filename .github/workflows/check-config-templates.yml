# GitHub Actions workflow to check if config templates are up-to-date
# This ensures that any changes to model configs have corresponding template updates

name: Check Config Templates

on:
  pull_request:
    paths:
      - 'configs/model/**/*.yaml'
      - '.config-template-gen.yaml'
      - 'scripts/generate_config_templates.py'

jobs:
  check-templates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Check if templates are up-to-date
        run: |
          python scripts/generate_config_templates.py --dry-run

      - name: Generate templates (for comparison)
        run: |
          python scripts/generate_config_templates.py

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code configs/experiment/templates/ || \
          (echo "❌ Config templates are out of date!" && \
           echo "Please run: make generate-templates" && \
           echo "Or let pre-commit hook handle it automatically" && \
           exit 1)

      - name: Success message
        if: success()
        run: |
          echo "✅ All config templates are up-to-date!"
