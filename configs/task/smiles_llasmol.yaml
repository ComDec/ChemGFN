name: "LLasMol-smiles"

exp_name: "osunlp/LlaSMol-Llama2-7B"

data:
  path: ${oc.env:PROJECT_ROOT}/data/sft_dataset_Length30_100K_llasmol.json
  train_size: 0.95
  limit_prompts: 10000

model:
  name: "osunlp/LlaSMol-Llama2-7B"
  base_model: "meta-llama/Llama-2-7b-hf"
  # config settings from LLM4Chem
  lora_config:
    _target_: peft.LoraConfig
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "down_proj", "up_proj"]
    r: 16
    lora_alpha: 16
    lora_dropout: 0.1
    bias: "none"
    fan_in_fan_out: True

training:
  subtb_lambda: 1.0
  pf_temp_high: 2.0
  pf_temp_low: 0.5
  pf_temp_prob: 0.666
  use_buffer_prob: 0.25
  n_samples: 1
  lr: 0.0001
  accumulate_grad_batches: 1
  epochs: 300
  use_4bit: False

eval:
  n_probes: 10
  diversity_metric: null

reward:
  temp_start: 1.0
  temp_end: 0.8
  temp_horizon: 750
  vocab_alpha: -50
  buffer_size: 50
  sentence_validator: "rdkit"
  valid_sentence_alpha: 10.0
  smiles_vocab_path: "${oc.env:PROJECT_ROOT}/assets/llama3-smiles-vocab.txt"

callbacks:
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: "val/logP(s) (avg)"
    mode: "max"
    save_last: True
    dirpath: ${save_dir}/checkpoints/${now:%Y-%m-%d}_${now:%H-%M-%S}
    filename: "epoch={epoch:03d}"
    auto_insert_metric_name: True
  - _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: "val/logP(s) (avg)"
    mode: "max"
    patience: 10
  - _target_: pytorch_lightning.callbacks.ModelSummary
    max_depth: -1

constraints:
  min_sentence_len: 5
  max_sentence_len: 50
  illegal_tokens: []
