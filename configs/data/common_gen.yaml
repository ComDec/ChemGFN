_target_: chemgfn.data.common_gen_datamodule.CommonGenDataModule
tokenizer_name: ${model.tokenizer.pretrained_model_name_or_path}
dataset_name: "allenai/common_gen"

# The Hugging Face test split carries no reference sentences, so validation doubles as test.
train_split: "train"
val_split: "validation"
test_split: "validation"

prompt_template: "Write one short, fluent sentence that uses ALL of these concepts: {concepts}.\nSentence:"

limit_train: 5000
limit_val: 1000
limit_test: 1000

# Repeat the (possibly limited) train subset up to this many concept sets.
train_repeat_to: null

shuffle_train: true
seed: ${seed}
num_workers: 0
pin_memory: true
