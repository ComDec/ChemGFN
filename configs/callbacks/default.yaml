defaults:
  - model_checkpoint
  # - early_stopping
  - model_summary
  - _self_

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}_diversity_{val/diversity:.4f}"
  every_n_epochs: 10
  monitor: "val/diversity"
  save_last: True
  auto_insert_metric_name: False
  mode: "max"

early_stopping:
  monitor: "val/loss"
  patience: 100
  mode: "min"

model_summary:
  max_depth: 1
