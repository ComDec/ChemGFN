# @package _global_

# Expr24 with SubTB + batch diversity only.

defaults:
  - override /data: expr24
  - override /model: llama3_expr24
  - override /callbacks: default
  - override /trainer: default

exp_name: "expr24_entropy_diversity_100_20_high_pf_temp_fix_cfg"
tags: ["ChemGFN", "expr24", "diversity", "high_pf_temp"]
seed: 42


trainer:
  devices: 4

model:
  loss_fn:
    _target_: chemgfn.models.losses.SubTBBatchDiversityLoss
    subtb_lambda: 1.0
    balance: 0.0
    eps: 1e-8
    seq_diversity_weight: 0.2
    pos_diversity_weight: 0.2
    pos_max: 2
    use_logits: false

  constraint_config:
    disable_grammar: false

  training_mixed_config:
    subtb_lambda: 1.0
    pf_temp_high: 4.0
    pf_temp_low: 1.5
    pf_temp_prob: 0.8
    buffer_mixture_ratio: 0.5

  factor_schedulers:
    seq_diversity_weight:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 1.0
      end: 0.2
      horizon: 50000
    pos_diversity_weight:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 1.0
      end: 0.2
      horizon: 50000

    replay_buffer:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 0.25
      end: 0.0
      horizon: 50000
    dataset_buffer:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 1.0
      end: 0.0
      horizon: 25000

logger:
  wandb:
    offline: false
