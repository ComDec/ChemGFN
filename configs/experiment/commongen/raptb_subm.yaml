# @package _global_
#
# Reproduces Table 5 (tab:commongen_results), row "RapTB+SubM", and the
# corresponding column of Table 20 (tab:commongen_qual).
# Task: CommonGen constrained sentence generation.
# The prompt set is the fixed 10-concept-set diagnostic subset of the CommonGen
# validation split described in Appendix `app:commongen_subset`.

defaults:
  - override /data: common_gen
  - override /model: common_gen
  - override /callbacks: default
  - override /trainer: default

tags: ["chemgfn", "commongen", "raptb", "subm"]
exp_name: "commongen_raptb_subm"
seed: 0

data:
  train_split: "validation"
  val_split: "validation"
  test_split: "validation"
  limit_train: 10
  train_repeat_to: 1000
  limit_val: 10
  limit_test: 10
  shuffle_train: false

trainer:
  devices: 1
  precision: bf16-true
  max_steps: 2500
  accumulate_grad_batches: 1
  limit_train_batches: 500
  limit_val_batches: 10
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0

model:
  reward:
    _target_: chemgfn.models.reward.CommonGenReward
    illegal_vocab_penalty: -50
    grammar_disagree_penalty: 0
    score_function: "score_fast"
    sentence_validator:
      _target_: chemgfn.models.validators.CommonGenValidator
      coverage_weight: 1.0
      quality_weight: 1.0
      hard_coverage_bonus: 1.0
      valid_step_weight: 1.0
      valid_step_every: 2
      valid_terminal_bonus: 0.0
      ngram_n: 2
      compute_bleu: true
      compute_bertscore: true

  loss_fn:
    _target_: chemgfn.models.losses.RapTBLoss
    subtb_lambda: 1.0
    aux_weight: 0.1
    gamma: 0.99
    detach_pterm_in_aux: true
    eps: 1e-8
    extra_absorb_eps: 1e-6
    target_mode: "mix"
    k_min: 2
    mix_weight: 0.8
    soft_beta: 8.0
    soft_rho: 0.5

  reward_buffer:
    _target_: chemgfn.utils.replay_buffer.ReplayBufferSubmodular
    per_prompt: true
    diversity_valid_only: true
    buffer_size: 100
    weight_div: 2.0
    weight_val: 1.0
    weight_rew: 1.0
    validator_key: "local_score"
    validator_type: "max"
    set_function_obj:
      _target_: chemgfn.utils.replay_buffer.FacilityLengthSetFunction
    similarity_backend:
      _target_: chemgfn.utils.replay_buffer.ShingleJaccardBackend
      k: 1
    length_bin_size: 4
    length_alpha_power: 1.0
    weight_len: 0.0

  training_mixed_config:
    pf_temp_high: 1.5
    pf_temp_low: 0.8
    pf_temp_prob: 0.666
    pf_temp_eval: 1.0
    n_samples: 32
    buffer_mixture_ratio: 0.5
    grammar_disagree_penalty: ${model.reward.grammar_disagree_penalty}

  factor_schedulers:
    reward_temp:
      horizon: 2000
    replay_buffer:
      start: 0.5
      end: 0.25
      horizon: 2500
    dataset_buffer:
      start: 0
      end: 0
      horizon: 2500
    scaling_factor:
      start: 5
      end: 50
      horizon: 2500
    k_min:
      _target_: chemgfn.utils.schedulers.Scheduler
      schedule_type: "linear"
      start: 16
      end: 8
      horizon: 2500

logger:
  wandb:
    offline: false
