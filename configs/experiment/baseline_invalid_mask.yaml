# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: smiles_opt
  - override /model: llama3_smiles_opt
  - override /callbacks: default
  - override /trainer: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["ChemGFN"]

exp_name: "debug"
seed: 42

trainer:
  max_epochs: 50
  gradient_clip_val: 0.5
  accumulate_grad_batches: 4
  default_root_dir: ${paths.output_dir}
  precision: bf16-true
  devices: 1

model:
  reward:
    _target_: chemgfn.models.reward.Reference_Target_Score_Positive_Mixed_Invalid_Mask
    invalid_start_ratio: 3
    invalid_end_ratio: 1.5
    target_score_alpha: 0.8
    sentence_validator:
      _target_: chemgfn.models.reward.RDKitValidator
      scorer: "logP"
      backend: "pa"

  constraint_config:
    min_sentence_len: 2
    max_sentence_len: 5
    grammar_path: ${paths.assets_dir}/SMILES_grammars/generic.ebnf
    apply_grammar: true
    processor_type: "prefix"
    parse_mode: "full"  # can be "full" or "limited"

  reward_buffer:
    _target_: chemgfn.utils.gfn_utils.ReplayBuffer
    buffer_size: 200
    sim_tolerance: 0.75

  reward_config:
    reward_temp_start: 2
    reward_temp_end: 0.8
    reward_temp_horizon: 50000
    invalid_vocab_alpha: -80
    advantage_alpha_start: 1.0
    advantage_alpha_end: 1.0
    advantage_alpha_horizon: 50000000

  training_mixed_config:
    use_buffer_prob: 0.25
    pf_temp_high: 2.0
    pf_temp_low: 0.5
    pf_temp_prob: 0.666
    use_buffer_sample_start_prob: 0.0
    use_buffer_sample_end_prob: 0.0
    buffer_sample_steps: 20000

data:
  num_workers: 8

logger:
  wandb:
    project: "ChemGFN"
    offline: false
