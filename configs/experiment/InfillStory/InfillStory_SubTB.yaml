# @package _global_

defaults:
  - override /data: infill_story
  - override /model: infill_story
  - override /callbacks: default
  - override /trainer: default

tags: ["ChemGFN", "infill_story", "SubTB"]

exp_name: "InfillStory_SubTB"
seed: 27

callbacks:
  checkpoint:
    monitor: "val/diversity"
    mode: "max"
    save_top_k: 0
    save_last: false

trainer:
  max_steps: 4000
  gradient_clip_val: 0.5
  accumulate_grad_batches: 4
  default_root_dir: ${paths.output_dir}
  precision: bf16-true
  devices: 1
  num_sanity_val_steps: 0
  limit_train_batches: 400
  limit_val_batches: 50

model:
  loss_fn:
    _target_: chemgfn.models.losses.ModifiedSubTBLoss
    subtb_lambda: 1.0
    eps: 1e-8

  training_mixed_config:
    pf_temp_high: 2.0
    pf_temp_low: 0.5
    pf_temp_prob: 0.666
    pf_temp_eval: 1.5
    n_samples: 20
    buffer_mixture_ratio: 0.5
    skip_baseline_sampling: true
    opt_task: false
    grammar_disagree_penalty: ${model.reward.grammar_disagree_penalty}

  factor_schedulers:
    reward_temp:
      horizon: 1000
    replay_buffer:
      start: 0.25
      end: 0.5
      horizon: 4000
    dataset_buffer:
      start: 0
      end: 0
      horizon: 4000
    scaling_factor:
      start: 1
      end: 1
      horizon: 1000
