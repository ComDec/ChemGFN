# @package _global_

# Debug experiment for SMILES optimization task
# Run with: python chemgfn/train.py experiment=debug

defaults:
  - override /data: smiles_opt
  - override /model: llama3_smiles_opt
  - override /callbacks: default
  - override /trainer: default

tags: ["ChemGFN", "debug", "smiles_opt"]

exp_name: "debug"
seed: 42

# ============================================================================
# Trainer Configuration
# ============================================================================
trainer:
  max_epochs: 50
  gradient_clip_val: 0.5
  accumulate_grad_batches: 4
  default_root_dir: ${paths.output_dir}
  precision: bf16-true
  devices: 1

# ============================================================================
# Model Overrides (only parameters that differ from base config)
# ============================================================================
model:
  # Override reward configuration
  reward:
    invalid_start_ratio: 3.0
    invalid_end_ratio: 5.0
    illegal_vocab_penalty: -80

  # Override reward buffer
  reward_buffer:
    buffer_size: 200
    sim_tolerance: 0.75

  # Override constraints
  constraint_config:
    min_sentence_len: 2
    max_sentence_len: 2
    parse_mode: "full"

  # Override training config
  training_mixed_config:
    use_buffer_prob: 0.99

  # Override reward scheduling
  reward_config:

# ============================================================================
# Data Configuration
# ============================================================================
data:
  num_workers: 0
# ============================================================================
# Logger Configuration
# ============================================================================
logger:
  wandb:
    project: "ChemGFN"
    offline: true
