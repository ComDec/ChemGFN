# @package _global_

# Expr24 with batch diversity + MCMC prior (sequence & batch KL).

defaults:
  - override /data: expr24
  - override /model: llama3_expr24
  - override /callbacks: default
  - override /trainer: default

exp_name: "expr24_diversity_prior"
tags: ["ChemGFN", "expr24", "diversity", "prior"]
seed: 42

model:
  loss_fn:
    _target_: chemgfn.models.losses.SubTBBatchDiversityPriorLoss
    subtb_lambda: 1.0
    balance: 0.0
    eps: 1e-8
    # diversity
    seq_diversity_weight: 0.1
    pos_diversity_weight: 0.1
    pos_max: 2
    use_logits: false
    # prior
    q_mcmc_path: ${paths.data_dir}/24_points/q_mcmc_bigram.pkl.gz
    base_n: 2
    bos_id: -1
    seq_prior_weight: 0.1
    batch_prior_weight: 0.05
    batch_prior_max_pos: 2
    prior_temperature: 1.0

  factor_schedulers:
    seq_diversity_weight:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 0.1
      end: 0.0
      horizon: 5000
    pos_diversity_weight:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 0.1
      end: 0.0
      horizon: 5000
    seq_prior_weight:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 0.1
      end: 0.05
      horizon: 20000
    batch_prior_weight:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 0.05
      end: 0.05
      horizon: 1

logger:
  wandb:
    offline: true
