# @package _global_
# Debug experiment for 24-points task with coverage tracking
# Run with: python chemgfn/train.py experiment=Expr24_Toy_RapTB_Coverage

defaults:
  - override /data: expr24
  - override /model: llama3_expr24
  - override /callbacks: default
  - override /trainer: default

tags: ["ChemGFN", "expr24_toy", "CFG", "RapTB", "coverage"]

exp_name: "Expr24_Toy_RapTB_Coverag_L7"
seed: 42

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}_diversity_{val/diversity:.4f}"
  every_n_epochs: 10
  monitor: "val/diversity_valid"
  save_last: True
  auto_insert_metric_name: False
  mode: "max"
  save_top_k: 0

# ============================================================================
# Trainer Configuration
# ============================================================================
trainer:
  max_steps: 5000
  gradient_clip_val: 0.5
  accumulate_grad_batches: 4
  check_val_every_n_epoch: 0
  default_root_dir: ${paths.output_dir}
  precision: bf16-true
  devices: 1
  num_sanity_val_steps: 0
  limit_train_batches: 5000
  limit_val_batches: 0

# ============================================================================
# Model Overrides
# ============================================================================
model:
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.0001

  reward:
    _target_: chemgfn.models.reward.Reference_Target_Score_Positive_Mixed_Invalid_Mask_PrefixShaping
    invalid_start_ratio: 0.2
    invalid_end_ratio: 1.2
    disable_peft: ${model.disable_peft}
    illegal_vocab_penalty: 0
    grammar_disagree_penalty: 0
    phi_weight: 0
    score_function: "score_fast"
    sentence_validator:
      _target_: chemgfn.models.validators.Expr24Validator
      scorer: "hit24_dense"
      target_value: 24
      amortize_valid_state: false

  loss_fn:
    _target_: chemgfn.models.losses.RootAbsorbExtraSubTBLossFixTBLogZv2
    subtb_lambda: 1.0
    aux_weight: 0.25
    gamma: 0.99
    detach_pterm_in_aux: true
    eps: 1e-8
    extra_absorb_eps: 1e-6
    target_mode: "mix"
    k_min: 2
    # mix mode params
    mix_weight: 0.8
    soft_beta: 3.0
    soft_rho: 0.5

  reward_buffer:
    _target_: chemgfn.utils.gfn_utils.ReplayBuffer
    buffer_size: 200
    sim_tolerance: 0.25
    strict_mode: false
    buffer_aug_value: 0

  constraint_config:
    min_sentence_len: 5
    max_sentence_len: 7
    grammar_path: ${paths.assets_dir}/24_grammars/var_length.ebnf
    disable_grammar: false
    processor_type: "prefix"
    legal_tokens: ${paths.assets_dir}/token_list/24_points/general
    illegal_vocab_penalty: -50
    parse_mode: "limited"

  training_mixed_config:
    subtb_lambda: 1.0
    pf_temp_high: 1.0
    pf_temp_low: 1.0
    pf_temp_prob: 0.666
    n_samples: 32
    buffer_mixture_ratio: 0.5
    skip_baseline_sampling: true
    opt_task: false
    grammar_disagree_penalty: ${model.reward.grammar_disagree_penalty}

  factor_schedulers:
    reward_temp:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 1
      end: 1
      horizon: 5000
    replay_buffer:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 0.25
      end: 0.0
      horizon: 5000
    dataset_buffer:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 0
      end: 0
      horizon: 2500
    reference_logits_scale:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 1
      end: 1.0
      horizon: 5000
    pf_temp_low:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 0.8
      end: 1.0
      horizon: 5000
    pf_temp_high:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 1.5
      end: 1.0
      horizon: 5000
    scaling_factor:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 50
      end: 50
      horizon: 5000
    k_min:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 7
      end: 3
      horizon: 5000

  disable_peft: false

  coverage_config:
    enabled: true
    reference_source: "dataset_buffer"

# ============================================================================
# Data Configuration
# ============================================================================
data:
  num_workers: 0
  buffer_sample_path: ${paths.data_dir}/24_points/buffer_24_len1to9_non_zero.pt

# ============================================================================
# Logger Configuration
# ============================================================================
logger:
  wandb:
    project: "ChemGFN"
    offline: false
