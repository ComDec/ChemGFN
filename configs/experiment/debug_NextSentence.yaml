# @package _global_

defaults:
  - override /data: next_sentence
  - override /model: next_sentence
  - override /callbacks: default
  - override /trainer: default

tags: ["ChemGFN", "next_sentence", "TB"]

exp_name: "debug_NextSentence_TB"
seed: 27

callbacks:
  checkpoint:
    monitor: "val/diversity"
    mode: "max"
    save_top_k: 0
    save_last: true

trainer:
  max_steps: 3000
  gradient_clip_val: 0.5
  accumulate_grad_batches: 4
  check_val_every_n_epoch: 1
  default_root_dir: ${paths.output_dir}
  precision: bf16-true
  devices: 1
  num_sanity_val_steps: 0
  limit_train_batches: 10
  limit_val_batches: 10

model:
  reward:
    sentence_validator:
      _target_: chemgfn.models.validators.RuleSentenceValidator

  loss_fn:
    _target_: chemgfn.models.losses.LLMTrajectoryBalanceLoss
    subtb_lambda: 1.0
    eps: 1e-8

  training_mixed_config:
    pf_temp_high: 2.0
    pf_temp_low: 0.5
    pf_temp_prob: 0.666
    pf_temp_eval: 2.0
    n_samples: 20
    buffer_mixture_ratio: 0.5
    skip_baseline_sampling: true
    disable_grammar: true
    opt_task: false
    grammar_disagree_penalty: ${model.reward.grammar_disagree_penalty}

  factor_schedulers:
    reward_temp:
      start: 2.0
      end: 0.8
      horizon: 750
    replay_buffer:
      start: 0.25
      end: 0.5
      horizon: 3000
    dataset_buffer:
      start: 0
      end: 0
      horizon: 3000
    scaling_factor:
      start: 1
      end: 1
      horizon: 1000

data:
  limit_prompts: 1000

logger:
  wandb:
    project: "ChemGFN"
    offline: 0
