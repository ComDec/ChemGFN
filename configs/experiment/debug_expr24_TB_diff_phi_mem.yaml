# @package _global_

# Debug experiment for 24-points task
# Run with: python chemgfn/train.py experiment=debug_expr24

defaults:
  - override /data: expr24
  - override /model: llama3_expr24
  - override /callbacks: default
  - override /trainer: default

tags: ["ChemGFN", "debug", "expr24"]

# add CFG, add valid score to reward, we always need a reward to guide the generation
exp_name: "debug_expr24_TB_diff_mem_phi_1"
seed: 42

# ============================================================================
# Trainer Configuration
# ============================================================================
trainer:
  max_steps: 60000
  gradient_clip_val: 0.5
  accumulate_grad_batches: 4
  default_root_dir: ${paths.output_dir}
  precision: bf16-true
  devices: 1
  num_sanity_val_steps: 0
  limit_train_batches: 30
  limit_val_batches: 5
  log_every_n_steps: 10

# ============================================================================
# Model Overrides (only parameters that differ from base config)
# ============================================================================
model:
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.0001

  reward:
    _target_: chemgfn.models.reward.Reference_Target_Score_Positive_Mixed_Invalid_Mask_PrefixShapingWithMemory

    # config params
    illegal_vocab_penalty: 0
    grammar_disagree_penalty: 0 # for any baseline, we MUST set this to 0

    # phi params
    phi_weight: 1.0
    phi_warmup: 20
    phi_ramp_steps: 200
    phi_decay_start: 1000
    phi_decay_gamma: 0.999
    dphi_clip: 2.0

    # entropy gate
    use_entropy_gate: true
    ent_lo: 0.10
    ent_hi: 0.55

    # phi build params
    phi_eta: 1.0
    phi_clamp: 2.0
    pv_memory_kwargs:
      kmax: 4
      alpha: 1.0
      gamma: 0.999
      min_count: 50.0
      max_keys: 500000
      prune_every: 2000
      prune_threshold: 1.0
      tau_conf: 20.0

    score_function: "score_fast"
    sentence_validator:
      _target_: chemgfn.models.reward.Expr24Validator
      amortize_valid_state: false

  loss_fn:
    _target_: chemgfn.models.losses.LLMTrajectoryBalanceLoss
    subtb_lambda: 1.0
    eps: 1e-8

  reward_buffer:
    _target_: chemgfn.utils.gfn_utils.ReplayBuffer
    buffer_size: 200
    sim_tolerance: 0.25
    strict_mode: false
    buffer_aug_value: 0

  constraint_config:
    min_sentence_len: 7
    max_sentence_len: 7
    grammar_path: ${paths.assets_dir}/24_grammars/general.ebnf
    disable_grammar: false
    processor_type: "prefix"
    legal_tokens: ${paths.assets_dir}/token_list/24_points/general
    illegal_vocab_penalty: -50
    parse_mode: "limited"

  training_mixed_config:
    subtb_lambda: 1.0
    pf_temp_high: 1.0
    pf_temp_low: 1.0
    pf_temp_prob: 0.666
    n_samples: 32
    buffer_mixture_ratio: 0.7
    skip_baseline_sampling: true
    opt_task: false
    grammar_disagree_penalty: ${model.reward.grammar_disagree_penalty}

  factor_schedulers:
    reward_temp:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 1
      end: 1
      horizon: 50000
    replay_buffer:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 0.50
      end: 0.25
      horizon: 50000
    dataset_buffer:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 0.75
      end: 0.25
      horizon: 25000
    reference_logits_scale:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 1
      end: 1.0
      horizon: 50000
    pf_temp_low:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 0.8
      end: 1.0
      horizon: 50000
    pf_temp_high:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 1.5
      end: 1.0
      horizon: 50000
    scaling_factor:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 50
      end: 50
      horizon: 10000

  disable_peft: false

# ============================================================================
# Data Configuration
# ============================================================================
data:
  num_workers: 8

# ============================================================================
# Logger Configuration
# ============================================================================
logger:
  wandb:
    project: "ChemGFN"
    offline: false
