# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: smiles_opt
  - override /model: llama3_smiles_opt
  - override /callbacks: default
  - override /trainer: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["ChemGFN"]

exp_name: "R(invalid_30-50)_M(llama3)_L(min2max5)_N8G4_(baseline)"
seed: 42

trainer:
  max_epochs: 150
  gradient_clip_val: 0.5
  accumulate_grad_batches: 4
  default_root_dir: ${paths.output_dir}
  precision: bf16-true
  devices: 4

model:
  reward:
    _target_: chemgfn.models.reward.Reference_Target_Score_Positive_Mixed_Invalid_Mask
    invalid_start_ratio: 3
    invalid_end_ratio: 5.0
    sentence_validator:
      _target_: chemgfn.models.reward.RDKitValidator
      scorer: "logP"
      backend: "pa"

  constraint_config:
    min_sentence_len: 2
    max_sentence_len: 5
    grammar_path: ${paths.assets_dir}/SMILES_grammars/generic.ebnf
    apply_grammar: true
    processor_type: "prefix"
    parse_mode: "full"  # can be "full" or "limited"

  reward_buffer:
    _target_: chemgfn.utils.gfn_utils.ReplayBufferNative
    buffer_size: 200
    sim_tolerance: 0.75

  training_mixed_config:
    use_buffer_prob: 0.25
    pf_temp_high: 2.0
    pf_temp_low: 0.5
    pf_temp_prob: 0.666

  reward_config:
    scaling_factor_start: 0
    scaling_factor_end: 0
    scaling_factor_horizon: 50000

data:
  num_workers: 8

logger:
  wandb:
    project: "ChemGFN"
    offline: false
