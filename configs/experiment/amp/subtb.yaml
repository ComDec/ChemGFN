# @package _global_
#
# Reproduces Table 22 (tab:amp_results), row "SubTB".
# Task: antimicrobial peptide (AMP) sequence generation.

defaults:
  - override /data: amp
  - override /model: llama3_amp
  - override /callbacks: default
  - override /trainer: default

tags: ["chemgfn", "amp", "subtb"]

exp_name: "amp_subtb"
seed: 42

trainer:
  max_steps: 5000
  gradient_clip_val: 0.5
  accumulate_grad_batches: 4
  default_root_dir: ${paths.output_dir}
  precision: bf16-true
  devices: 1
  num_sanity_val_steps: 0
  limit_train_batches: 500
  limit_val_batches: 50

model:
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.0001

  loss_fn:
    _target_: chemgfn.models.losses.SubTBLoss
    subtb_lambda: 1.0
    eps: 1e-8

  reward_buffer:
    _target_: chemgfn.utils.replay_buffer.ReplayBuffer
    prioritized_replay: true
    buffer_size: 200
    sim_tolerance: 0.25

data:
  num_workers: 0

logger:
  wandb:
    project: "ChemGFN"
    offline: false
