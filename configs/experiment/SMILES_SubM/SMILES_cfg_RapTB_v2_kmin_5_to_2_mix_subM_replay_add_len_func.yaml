# @package _global_

# Debug experiment for 24-points task
# Run with: python chemgfn/train.py experiment=debug_expr24

defaults:
  - override /data: smiles_opt
  - override /model: llama3_smiles_opt
  - override /callbacks: default
  - override /trainer: default

tags: ["ChemGFN", "debug", "smiles_opt", "CFG", "qed", "TB"]

# add CFG, add valid score to reward, we always need a reward to guide the generation
exp_name: "smiles_RapTB_v2_kmin_5_to_2_mix_subM_replay_add_len_func"
seed: 42

# ============================================================================
# Trainer Configuration
# ============================================================================
trainer:
  max_steps:   5000
  gradient_clip_val: 0.5
  accumulate_grad_batches: 4
  default_root_dir: ${paths.output_dir}
  precision: bf16-true
  devices: 1
  num_sanity_val_steps: 0
  limit_train_batches:  500
  limit_val_batches:  50


# ============================================================================
# Model Overrides (only parameters that differ from base config)
# ============================================================================
model:
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.0001

  ema_config:
    enabled: false
    decay: 0.999
    ema_start_epoch: 10
    reference_start_epoch: 20
    reference_update_interval: 10

  reward:
    _target_: chemgfn.models.reward.Reference_Target_Score_Positive_Memory_PrefixShaping_NoBackoff
    disable_peft: ${model.disable_peft}

     # config params
    illegal_vocab_penalty: 0
    grammar_disagree_penalty: 0 # for any baseline, we MUST set this to 0

    # phi params
    phi_weight: 0

    # reward strategy
    reward_strategy: "smiles_absorbing"
    smiles_len_weight: 0.0
    smiles_score_clip: [0.0, 1.0]
    pv_update_strategy: smiles_global_score

    # entropy gate, UNDER DEVELOPMENT
    use_entropy_gate: false
    use_token_entropy_gate: false
    ent_lo: 0.10
    ent_hi: 0.55

    # phi build params
    phi_eta: 1.0
    phi_clamp: 2.0

    # split logic
    pv_split: 2
    pv_split_inclusive: true

    # pv memory params
    pv_memory_kwargs:
      alpha: 1.0
      gamma: 0.999
      max_keys: 500000
      prune_every: 200
      prune_threshold: 1.0
      tau_conf: 20.0

    score_function: "score_fast"
    sentence_validator:
      _target_: chemgfn.models.validators.RDKitValidator
      scorer: "qed"
      backend: "pa"

  loss_fn:
    _target_: chemgfn.models.losses.RootAbsorbExtraSubTBLossFixTBLogZv2
    subtb_lambda: 1.0
    aux_weight: 0.25
    gamma: 0.99
    detach_pterm_in_aux: true
    eps: 1e-8
    extra_absorb_eps: 1e-6
    target_mode: "mix"
    k_min: 2
    # mix mode params
    mix_weight: 0.5
    soft_beta: 5.0
    soft_rho: 0.1

  reward_buffer:
    _target_: chemgfn.utils.replay_buffer.ReplayBufferSubmodular
    buffer_size: 200
    weight_div: 1.0
    weight_val: 1.0
    weight_rew: 1.0
    default_strategy: "standard"
    validator_key: "local_score"
    validator_type: "max"

    stochastic_epsilon: 0.1
    ltlg_epsilon: 0.1

    set_function_obj:
      _target_: chemgfn.utils.replay_buffer.FacilityLengthSetFunction
    similarity_backend:
      _target_: chemgfn.utils.replay_buffer.RDKITBulkTanimotoBackend

    # length-collapse mitigation knobs
    length_bin_size: 1
    length_alpha_power: 1.0
    length_alpha_mode: "uniform"
    weight_len: 1.0

  constraint_config:
    min_sentence_len: 1
    max_sentence_len: 10
    grammar_path: ${paths.assets_dir}/SMILES_grammars/generic.ebnf
    disable_grammar: false
    processor_type: "prefix"
    legal_tokens: ${paths.assets_dir}/token_list/SMILES/allowed_llama3.2_1B_allowed_token
    illegal_vocab_penalty: -50
    parse_mode: "limited"

  training_mixed_config:
    subtb_lambda: 1.0
    pf_temp_high: 1.0
    pf_temp_low: 1.0
    pf_temp_prob: 0.666
    n_samples: 32
    buffer_mixture_ratio: 0.7
    skip_baseline_sampling: true
    opt_task: false
    # without applying grammar disagree penalty to forward side
    grammar_disagree_penalty: ${model.reward.grammar_disagree_penalty}

  factor_schedulers:
    reward_temp:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 1
      end: 1
      horizon: 50000
    replay_buffer:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 0.50
      end: 0.25
      horizon: 50000
    dataset_buffer:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 0.75
      end: 0.25
      horizon: 25000
    reference_logits_scale:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 1
      end: 1.0
      horizon: 50000
    pf_temp_low:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 0.8
      end: 1.0
      horizon: 50000
    pf_temp_high:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 1.5
      end: 1.0
      horizon: 50000
    scaling_factor:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 50
      end: 50
      horizon: 10000
    k_min:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 5
      end: 2
      horizon: 5000

  disable_peft: false

# ============================================================================
# Data Configuration
# ============================================================================
data:
  num_workers: 0
  data_path: ${paths.data_dir}SMILES/sidechain_prompts_qed.json
  buffer_sample_path: null

# ============================================================================
# Logger Configuration
# ============================================================================
logger:
  wandb:
    project: "ChemGFN"
    offline: False
