# @package _global_

# Debug experiment for 24-points task
# Run with: python chemgfn/train.py experiment=debug_expr24

defaults:
  - override /data: expr24
  - override /model: llama3_expr24
  - override /callbacks: default
  - override /trainer: default

tags: ["ChemGFN", "baseline", "expr24", "enable_cfg", "dataset_buffer_mix"]

# add CFG, add valid score to reward, we always need a reward to guide the generation
exp_name: "baseline_expr24_zero_enable_cfg_ds_mix_0.5_start_1.0_fix_acc_tune_fix_ref_model"
seed: 42

# ============================================================================
# Trainer Configuration
# ============================================================================
trainer:
  max_steps: 60000
  gradient_clip_val: 0.5
  accumulate_grad_batches: 4
  default_root_dir: ${paths.output_dir}
  precision: bf16-true
  devices: 4

# ============================================================================
# Model Overrides (only parameters that differ from base config)
# ============================================================================
model:
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.0001

  reward:
    _target_: chemgfn.models.reward.Reference_Target_Score_Positive_Mixed_Invalid_Mask
    invalid_start_ratio: 0.2
    invalid_end_ratio: 1.2
    disable_peft: ${model.disable_peft}
    illegal_vocab_penalty: 0
    grammar_disagree_penalty: 0 # for any baseline, we MUST set this to 0
    sentence_validator:
      _target_: chemgfn.models.reward.Expr24Validator
      amortize_valid_state: false

  loss_fn:
    _target_: chemgfn.models.losses.ModifiedSubTBLoss
    subtb_lambda: 1.0
    eps: 1e-8

  reward_buffer:
    _target_: chemgfn.utils.gfn_utils.ReplayBuffer
    buffer_size: 200
    sim_tolerance: 0.25
    strict_mode: false
    buffer_aug_value: 0.0

  constraint_config:
    min_sentence_len: 1
    max_sentence_len: 7
    grammar_path: ${paths.assets_dir}/24_grammars/general.ebnf
    disable_grammar: false
    processor_type: "prefix"
    legal_tokens: ${paths.assets_dir}/token_list/24_points/general
    illegal_vocab_penalty: -50
    parse_mode: "limited"

  training_mixed_config:
    subtb_lambda: 1.0
    pf_temp_high: 2.0
    pf_temp_low: 0.5
    pf_temp_prob: 0.666
    n_samples: 10
    buffer_mixture_ratio: 1.0
    skip_baseline_sampling: true
    opt_task: false

  factor_schedulers:
    reward_temp:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 2
      end: 0.8
      horizon: 50000
    replay_buffer:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 0.5
      end: 0.25
      horizon: 50000
    dataset_buffer:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 0.5
      end: 0.0
      horizon: 25000
    reference_logits_scale:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 1
      end: 1.0
      horizon: 50000

# ============================================================================
# Data Configuration
# ============================================================================
data:
  num_workers: 8

# ============================================================================
# Logger Configuration
# ============================================================================
logger:
  wandb:
    project: "ChemGFN"
    offline: false
