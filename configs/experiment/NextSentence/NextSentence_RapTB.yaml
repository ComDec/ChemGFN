# @package _global_

defaults:
  - override /data: next_sentence
  - override /model: next_sentence
  - override /callbacks: default
  - override /trainer: default

tags: ["ChemGFN", "next_sentence", "RapTB", "submodular_buffer"]

exp_name: "NextSentence_RapTB"
seed: 27

callbacks:
  checkpoint:
    monitor: "val/diversity"
    mode: "max"
    save_top_k: 1
    save_last: true

trainer:
  max_steps: 5000
  gradient_clip_val: 0.5
  accumulate_grad_batches: 4
  default_root_dir: ${paths.output_dir}
  precision: bf16-true
  devices: 1
  num_sanity_val_steps: 0
  limit_train_batches: 500
  limit_val_batches: 50

model:
  reward:
    sentence_validator:
      _target_: chemgfn.models.validators.RuleSentenceValidator

  loss_fn:
    _target_: chemgfn.models.losses.RootAbsorbExtraSubTBLossFixTBLogZv2
    subtb_lambda: 1.0
    aux_weight: 0.25
    gamma: 0.99
    detach_pterm_in_aux: true
    eps: 1e-8
    extra_absorb_eps: 1e-6
    target_mode: "mix"
    k_min: 2
    mix_weight: 0.5
    soft_beta: 5.0
    soft_rho: 0.1

  training_mixed_config:
    pf_temp_high: 2.0
    pf_temp_low: 0.5
    pf_temp_prob: 0.666
    pf_temp_eval: 1.5
    n_samples: 20
    buffer_mixture_ratio: 0.5
    skip_baseline_sampling: true
    opt_task: false
    grammar_disagree_penalty: ${model.reward.grammar_disagree_penalty}

  factor_schedulers:
    reward_temp:
      horizon: 1000
    replay_buffer:
      start: 0.25
      end: 0.5
      horizon: 5000
    dataset_buffer:
      start: 0
      end: 0
      horizon: 5000
    scaling_factor:
      start: 1
      end: 1
      horizon: 1000
    k_min:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 20
      end: 12
      horizon: 5000

data:
  limit_prompts: 1000
