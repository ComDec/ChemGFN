# @package _global_

# Debug experiment for 24-points task
# Run with: python chemgfn/train.py experiment=debug_expr24

defaults:
  - override /data: expr24
  - override /model: llama3_expr24
  - override /callbacks: default
  - override /trainer: default

tags: ["ChemGFN", "debug", "expr24"]

exp_name: "debug_expr24"
seed: 42

# ============================================================================
# Trainer Configuration
# ============================================================================
trainer:
  max_epochs: 150
  gradient_clip_val: 0.5
  accumulate_grad_batches: 4
  default_root_dir: ${paths.output_dir}
  precision: bf16-true
  limit_train_batches: 50
  limit_val_batches: 5
  devices: 1

# ============================================================================
# Model Overrides (only parameters that differ from base config)
# ============================================================================
model:
  optimizer:
    lr: 0.0001

  reward:
    _target_: chemgfn.models.reward.Reference_Target_Score_Split_Reward
    invalid_start_ratio: 0.2
    invalid_end_ratio: 1.2
    disable_peft: ${model.disable_peft}
    illegal_vocab_penalty: -99
    grammar_disagree_penalty: -99
    sentence_validator:
      _target_: chemgfn.models.reward.Expr24Validator

  loss_fn:
    _target_: chemgfn.models.losses.ModifiedSubTBLossSplitReward
    subtb_lambda: 1.0
    eps: 1e-8
    alpha_reference: 0.5

  reward_config:
    reward_temp_start: 2
    reward_temp_end: 0.8
    reward_temp_horizon: 50000
    scaling_factor_start: 50
    scaling_factor_end: 100
    scaling_factor_horizon: 5000

  reward_buffer:
    _target_: chemgfn.utils.gfn_utils.ReplayBuffer
    buffer_size: 200
    sim_tolerance: 0.25

  constraint_config:
    min_sentence_len: 1
    max_sentence_len: 7
    grammar_path: ${paths.assets_dir}/24_grammars/general.ebnf
    apply_grammar: true
    processor_type: "prefix"
    legal_tokens: ${paths.assets_dir}/token_list/24_points/general
    illegal_vocab_penalty: -50
    parse_mode: "limited"

  training_mixed_config:
    subtb_lambda: 1.0
    pf_temp_high: 2.0
    pf_temp_low: 0.5
    pf_temp_prob: 0.666
    # Replay buffer (Buffer 1) schedule
    use_replay_buffer_start_prob: 0
    use_replay_buffer_end_prob: 0
    replay_buffer_steps: 50000
    n_samples: 8
    # Dataset buffer (Buffer 2) schedule
    use_buffer_sample_start_prob: 1.0
    use_buffer_sample_end_prob: 1.0
    buffer_sample_steps: 20000
    buffer_mixture_ratio: 1.0
    skip_baseline_sampling: true
    balance_start: 0.0
    balance_end: 1.0
    balance_horizon: 50000
    opt_task: false

# ============================================================================
# Data Configuration
# ============================================================================
data:
  num_workers: 8

# ============================================================================
# Logger Configuration
# ============================================================================
logger:
  wandb:
    project: "ChemGFN"
    offline: true
