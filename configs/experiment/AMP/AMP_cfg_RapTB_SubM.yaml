# @package _global_

defaults:
  - override /data: amp
  - override /model: llama3_amp
  - override /callbacks: default
  - override /trainer: default

tags: ["ChemGFN", "AMP", "CFG", "RapTB", "SubM"]

exp_name: "AMP_CFG_RapTB_SubM"
seed: 42

trainer:
  max_steps: 5000
  gradient_clip_val: 0.5
  accumulate_grad_batches: 4
  default_root_dir: ${paths.output_dir}
  precision: bf16-true
  devices: 1
  num_sanity_val_steps: 0
  limit_train_batches: 500
  limit_val_batches: 50

model:
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.0001

  ema_config:
    enabled: false
    decay: 0.999
    ema_start_epoch: 10
    reference_start_epoch: 20
    reference_update_interval: 10

  loss_fn:
    _target_: chemgfn.models.losses.RootAbsorbExtraSubTBLossFixTBLogZv2
    subtb_lambda: 1.0
    aux_weight: 0.25
    gamma: 0.99
    detach_pterm_in_aux: true
    eps: 1e-8
    extra_absorb_eps: 1e-6
    target_mode: "mix"
    k_min: 2
    mix_weight: 0.5
    soft_beta: 5.0
    soft_rho: 0.1

  reward_buffer:
    _target_: chemgfn.utils.replay_buffer.ReplayBufferSubmodular
    buffer_size: 200
    weight_div: 1.0
    weight_val: 1.0
    weight_rew: 1.0
    default_strategy: "standard"
    validator_key: "local_score"
    validator_type: "max"

    stochastic_epsilon: 0.1
    ltlg_epsilon: 0.1

    set_function_obj:
      _target_: chemgfn.utils.replay_buffer.FacilityLengthSetFunction
    similarity_backend:
      _target_: chemgfn.utils.replay_buffer.ShingleJaccardBackend

    length_bin_size: 1
    length_alpha_power: 1.0
    length_alpha_mode: "uniform"
    weight_len: 1.0

  factor_schedulers:
    reward_temp:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 1
      end: 1
      horizon: 5000
    replay_buffer:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 0.50
      end: 0.25
      horizon: 5000
    dataset_buffer:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 0.75
      end: 0.25
      horizon: 2500
    reference_logits_scale:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 1
      end: 1.0
      horizon: 5000
    pf_temp_low:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 0.8
      end: 1.0
      horizon: 5000
    pf_temp_high:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 1.5
      end: 1.0
      horizon: 5000
    scaling_factor:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 50
      end: 50
      horizon: 1000
    alpha_reference:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 0.0
      end: 0.0
      horizon: 50000
    k_min:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 5
      end: 2
      horizon: 5000

data:
  num_workers: 0

logger:
  wandb:
    project: "ChemGFN"
    offline: False
