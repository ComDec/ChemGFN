# @package _global_

# Debug experiment for 24-points task
# Run with: python chemgfn/train.py experiment=debug_expr24

defaults:
  - override /data: expr24
  - override /model: llama3_expr24
  - override /callbacks: default
  - override /trainer: default

tags: ["ChemGFN", "split_loss", "expr24"]

exp_name: "expr24_split_loss_base"
seed: 42

# ============================================================================
# Trainer Configuration
# ============================================================================
trainer:
  max_epochs: 150
  gradient_clip_val: 0.5
  accumulate_grad_batches: 4
  default_root_dir: ${paths.output_dir}
  precision: bf16-true
  devices: 4

# ============================================================================
# Model Overrides (only parameters that differ from base config)
# ============================================================================
model:
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.0001
    weight_decay: 0.01

  reward:
    _target_: chemgfn.models.reward.Reference_Target_Score_Split_Reward
    disable_peft: ${model.disable_peft}
    illegal_vocab_penalty: -99
    grammar_disagree_penalty: -99
    sentence_validator:
      _target_: chemgfn.models.reward.Expr24Validator

  loss_fn:
    _target_: chemgfn.models.losses.ModifiedSubTBLossSplitReward
    subtb_lambda: 1.0
    eps: 1e-8
    alpha_reference: 0.5

  reward_buffer:
    _target_: chemgfn.utils.gfn_utils.ReplayBuffer
    buffer_size: 200
    sim_tolerance: 0.25

  constraint_config:
    min_sentence_len: 1
    max_sentence_len: 7
    grammar_path: ${paths.assets_dir}/24_grammars/general.ebnf
    disable_grammar: false
    processor_type: "prefix"
    legal_tokens: ${paths.assets_dir}/token_list/24_points/general
    illegal_vocab_penalty: -50
    parse_mode: "limited"

  training_mixed_config:
    pf_temp_high: 2.0
    pf_temp_low: 0.5
    pf_temp_prob: 0.666
    n_samples: 8
    buffer_mixture_ratio: 1.0
    skip_baseline_sampling: true
    opt_task: false

  factor_schedulers:
    reward_temp:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 2
      end: 0.8
      horizon: 50000
    replay_buffer:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 0.8
      end: 0.1
      horizon: 50000
    dataset_buffer:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 0.5
      end: 0.1
      horizon: 50000
    alpha_reference:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "cosine"
      start: 0.25
      end: 0.0
      horizon: 50000
    reference_logits_scale:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 0.0
      end: 0.0
      horizon: 50000
    scaling_factor:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 1
      end: 1
      horizon: 5000

# ============================================================================
# Data Configuration
# ============================================================================
data:
  num_workers: 8

# ============================================================================
# Logger Configuration
# ============================================================================
logger:
  wandb:
    project: "ChemGFN"
    offline: false
