# @package _global_

defaults:
  - override /data: common_gen
  - override /model: common_gen
  - override /callbacks: default
  - override /trainer: default

tags: ["ChemGFN", "common_gen", "RapTB", "SubM"]

exp_name: "CommonGen_RapTB_SubM"
seed: 42

callbacks:
  checkpoint:
    monitor: "val/diversity_valid"
    mode: "max"
    save_top_k: 1
    save_last: true

trainer:
  max_steps: 2500
  gradient_clip_val: 0.5
  accumulate_grad_batches: 4
  default_root_dir: ${paths.output_dir}
  precision: bf16-true
  devices: 1
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 1
  limit_train_batches: 500
  limit_val_batches: 50

model:
  reward:
    _target_: chemgfn.models.reward.CommonGen_Score_Positive_Mixed_Invalid_Mask
    invalid_start_ratio: 0.2
    invalid_end_ratio: 1.2
    illegal_vocab_penalty: -50
    grammar_disagree_penalty: 0
    score_function: "score_fast"
    sentence_validator:
      _target_: chemgfn.models.validators.CommonGenValidator
      coverage_weight: 1.0
      quality_weight: 0.5
      hard_coverage_bonus: 1.0
      valid_step_weight: 0.0
      valid_step_every: 1
      valid_terminal_bonus: 0.0
      ngram_n: 2
      compute_bleu: true
      compute_bertscore: false

  loss_fn:
    _target_: chemgfn.models.losses.RootAbsorbExtraSubTBLossFixTBLogZv2
    subtb_lambda: 1.0
    aux_weight: 0.1
    gamma: 0.99
    detach_pterm_in_aux: true
    eps: 1e-8
    extra_absorb_eps: 1e-6
    target_mode: "mix"
    k_min: 2
    mix_weight: 0.5
    soft_beta: 8.0
    soft_rho: 0.3

  reward_buffer:
    _target_: chemgfn.utils.replay_buffer.ReplayBufferSubmodular
    per_prompt: true
    diversity_valid_only: false
    buffer_size: 100
    weight_div: 2.0
    weight_val: 1.0
    weight_rew: 1.0
    default_strategy: "standard"
    validator_key: "local_score"
    validator_type: "max"
    stochastic_epsilon: 0.1
    ltlg_epsilon: 0.1
    set_function_obj:
      _target_: chemgfn.utils.replay_buffer.FacilityLengthSetFunction
    similarity_backend:
      _target_: chemgfn.utils.replay_buffer.ShingleJaccardBackend
      k: 2
      tokenizer_mode: "word"
    length_bin_size: 4
    length_alpha_power: 1.0
    weight_len: 0.0

  training_mixed_config:
    pf_temp_high: 1.5
    pf_temp_low: 0.8
    pf_temp_prob: 0.666
    pf_temp_eval: 1.0
    n_samples: 32
    buffer_mixture_ratio: 0.5
    skip_baseline_sampling: true
    opt_task: false
    grammar_disagree_penalty: ${model.reward.grammar_disagree_penalty}

  factor_schedulers:
    reward_temp:
      horizon: 2000
    replay_buffer:
      start: 0.5
      end: 0.25
      horizon: 2500
    dataset_buffer:
      start: 0
      end: 0
      horizon: 2500
    scaling_factor:
      start: 5
      end: 50
      horizon: 2500
    k_min:
      _target_: chemgfn.models.gfn.Scheduler
      schedule_type: "linear"
      start: 16
      end: 8
      horizon: 2500

logger:
  wandb:
    offline: false
