# @package _global_
#
# Reproduces Table 3 (tab:expr24_main), replay "SubM", row "RapTB".
# Task: variable-length Expr24 arithmetic-expression generation.

defaults:
  - override /data: expr24
  - override /model: llama3_expr24
  - override /callbacks: default
  - override /trainer: default

tags: ["chemgfn", "expr24", "subm", "raptb"]

exp_name: "expr24_subm_raptb"
seed: 42

trainer:
  max_steps: 5000
  gradient_clip_val: 0.5
  accumulate_grad_batches: 4
  default_root_dir: ${paths.output_dir}
  precision: bf16-true
  devices: 1
  num_sanity_val_steps: 0
  limit_train_batches: 500
  limit_val_batches: 50

model:
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.0001

  reward:
    _target_: chemgfn.models.reward.PrefixShapedReward
    illegal_vocab_penalty: 0
    grammar_disagree_penalty: 0 # no grammar-disagreement penalty in any released run
    score_function: "score_fast"
    sentence_validator:
      _target_: chemgfn.models.validators.Expr24Validator

  loss_fn:
    _target_: chemgfn.models.losses.RapTBLoss
    subtb_lambda: 1.0
    aux_weight: 0.1
    gamma: 0.99
    detach_pterm_in_aux: true
    eps: 1e-8
    extra_absorb_eps: 1e-6
    target_mode: "mix"
    k_min: 2
    # absorbed-target backup parameters
    mix_weight: 0.5
    soft_beta: 3.0
    soft_rho: 0.3

  reward_buffer:
    _target_: chemgfn.utils.replay_buffer.ReplayBufferSubmodular
    diversity_valid_only: true
    buffer_size: 200
    weight_div: 1.0
    weight_val: 10.0
    weight_rew: 1.0
    validator_key: "local_score"
    validator_type: "last"

    set_function_obj:
      _target_: chemgfn.utils.replay_buffer.FacilityLengthSetFunction
    similarity_backend:
      _target_: chemgfn.utils.replay_buffer.ShingleJaccardBackend

    # length-balancing term of the submodular objective
    length_bin_size: 2
    length_alpha_power: 2.0
    weight_len: 1.0

  constraint_config:
    min_sentence_len: 3
    max_sentence_len: 9
    grammar_path: ${paths.assets_dir}/24_grammars/var_length.ebnf
    disable_grammar: false
    processor_type: "prefix"
    legal_tokens: ${paths.assets_dir}/token_list/24_points/general
    parse_mode: "limited"

  training_mixed_config:
    pf_temp_high: 1.0
    pf_temp_low: 1.0
    pf_temp_prob: 0.666
    n_samples: 32
    buffer_mixture_ratio: 0.7
    grammar_disagree_penalty: ${model.reward.grammar_disagree_penalty}

  factor_schedulers:
    reward_temp:
      _target_: chemgfn.utils.schedulers.Scheduler
      schedule_type: "linear"
      start: 1
      end: 1
      horizon: 5000
    replay_buffer:
      _target_: chemgfn.utils.schedulers.Scheduler
      schedule_type: "linear"
      start: 0.50
      end: 0.25
      horizon: 5000
    dataset_buffer:
      _target_: chemgfn.utils.schedulers.Scheduler
      schedule_type: "linear"
      start: 0.0
      end: 0.0
      horizon: 2500
    reference_logits_scale:
      _target_: chemgfn.utils.schedulers.Scheduler
      schedule_type: "linear"
      start: 1
      end: 1.0
      horizon: 5000
    pf_temp_low:
      _target_: chemgfn.utils.schedulers.Scheduler
      schedule_type: "linear"
      start: 0.8
      end: 1.0
      horizon: 5000
    pf_temp_high:
      _target_: chemgfn.utils.schedulers.Scheduler
      schedule_type: "linear"
      start: 1.5
      end: 1.0
      horizon: 5000
    scaling_factor:
      _target_: chemgfn.utils.schedulers.Scheduler
      schedule_type: "linear"
      start: 50
      end: 50
      horizon: 1000
    k_min:
      _target_: chemgfn.utils.schedulers.Scheduler
      schedule_type: "linear"
      start: 7
      end: 3
      horizon: 5000

  disable_peft: false

data:
  num_workers: 0
  buffer_sample_path: null

logger:
  wandb:
    project: "ChemGFN"
    offline: false
