# @package _global_
#
# Reproduces Table 7 (tab:smiles_all_length_avg), row "SubTB+SubM".
# Task: scaffold-conditioned SMILES optimisation (QED reward), L_max = 10.

defaults:
  - override /data: smiles_opt
  - override /model: llama3_smiles_opt
  - override /callbacks: default
  - override /trainer: default

tags: ["chemgfn", "smiles", "subtb", "subm"]

exp_name: "smiles_subtb_subm"
seed: 42

trainer:
  max_steps: 5000
  gradient_clip_val: 0.5
  accumulate_grad_batches: 4
  default_root_dir: ${paths.output_dir}
  precision: bf16-true
  devices: 1
  num_sanity_val_steps: 0
  limit_train_batches: 500
  limit_val_batches: 50

model:
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.0001

  reward:
    _target_: chemgfn.models.reward.AbsorbingPrefixReward
    illegal_vocab_penalty: 0
    grammar_disagree_penalty: 0 # no grammar-disagreement penalty in any released run
    score_function: "score_fast"
    sentence_validator:
      _target_: chemgfn.models.validators.RDKitValidator
      scorer: "qed"

  loss_fn:
    _target_: chemgfn.models.losses.SubTBLoss
    subtb_lambda: 1.0
    eps: 1e-8

  reward_buffer:
    _target_: chemgfn.utils.replay_buffer.ReplayBufferSubmodular
    buffer_size: 200
    weight_div: 1.0
    weight_val: 1.0
    weight_rew: 1.0
    validator_key: "local_score"
    validator_type: "max"

    set_function_obj:
      _target_: chemgfn.utils.replay_buffer.FacilityLengthSetFunction
    similarity_backend:
      _target_: chemgfn.utils.replay_buffer.RDKITBulkTanimotoBackend

    # length-balancing term of the submodular objective
    length_bin_size: 1
    length_alpha_power: 1.0
    weight_len: 1.0

  constraint_config:
    min_sentence_len: 1
    max_sentence_len: 10
    grammar_path: ${paths.assets_dir}/SMILES_grammars/generic.ebnf
    disable_grammar: false
    processor_type: "prefix"
    legal_tokens: ${paths.assets_dir}/token_list/SMILES/allowed_llama3.2_1B_allowed_token
    parse_mode: "limited"

  training_mixed_config:
    pf_temp_high: 1.0
    pf_temp_low: 1.0
    pf_temp_prob: 0.666
    n_samples: 32
    buffer_mixture_ratio: 0.7
    # Mirrors the reward-side setting onto the sampler.
    grammar_disagree_penalty: ${model.reward.grammar_disagree_penalty}

  factor_schedulers:
    reward_temp:
      _target_: chemgfn.utils.schedulers.Scheduler
      schedule_type: "linear"
      start: 1
      end: 1
      horizon: 50000
    replay_buffer:
      _target_: chemgfn.utils.schedulers.Scheduler
      schedule_type: "linear"
      start: 0.50
      end: 0.25
      horizon: 50000
    dataset_buffer:
      _target_: chemgfn.utils.schedulers.Scheduler
      schedule_type: "linear"
      start: 0.75
      end: 0.25
      horizon: 25000
    reference_logits_scale:
      _target_: chemgfn.utils.schedulers.Scheduler
      schedule_type: "linear"
      start: 1
      end: 1.0
      horizon: 50000
    pf_temp_low:
      _target_: chemgfn.utils.schedulers.Scheduler
      schedule_type: "linear"
      start: 0.8
      end: 1.0
      horizon: 50000
    pf_temp_high:
      _target_: chemgfn.utils.schedulers.Scheduler
      schedule_type: "linear"
      start: 1.5
      end: 1.0
      horizon: 50000
    scaling_factor:
      _target_: chemgfn.utils.schedulers.Scheduler
      schedule_type: "linear"
      start: 50
      end: 50
      horizon: 10000

  disable_peft: false

data:
  num_workers: 0
  data_path: ${paths.data_dir}SMILES/sidechain_prompts_qed.json
  buffer_sample_path: null

logger:
  wandb:
    project: "ChemGFN"
    offline: 0
