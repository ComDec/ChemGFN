_target_: chemgfn.models.gfn.ChemGFNModule

lora_config:
  _target_: peft.LoraConfig
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "down_proj", "up_proj"]
  r: 16
  lora_alpha: 16
  lora_dropout: 0.1
  bias: "none"
  fan_in_fan_out: false

net_config:
  pretrained_model_name_or_path: "meta-llama/Llama-3.2-1B"

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001
  weight_decay: 0.01

tokenizer:
  _target_: transformers.AutoTokenizer.from_pretrained
  pretrained_model_name_or_path: ${model.net_config.pretrained_model_name_or_path}

scheduler:
  _target_: torch.optim.lr_scheduler.PolynomialLR
  _partial_: true
  total_iters: 100000
  power: 1.0

reward:
  _target_: chemgfn.models.reward.CommonGenReward
  illegal_vocab_penalty: -50
  grammar_disagree_penalty: 0
  score_function: "score_fast"
  sentence_validator:
    _target_: chemgfn.models.validators.CommonGenValidator
    coverage_weight: 1.0
    quality_weight: 0.5
    hard_coverage_bonus: 1.0
    # Validity definition, used for `acc` and for the invalid mask:
    # - english:  sentence-like English, ASCII only, no stray symbols
    # - keywords: valid iff every concept is covered
    validity_mode: "english"
    strict_ascii: true
    allowed_punctuation: " .,!?;:'\"()/-"
    require_capital_start: false
    require_verb: true
    min_alpha_tokens: 2
    single_sentence: true
    require_terminal_punct: false
    # Prefix shaping: credit prefixes that would be legal if terminated here.
    valid_step_weight: 0.0
    valid_step_every: 1
    # Bonus at the terminal state when the finished sentence is legal.
    valid_terminal_bonus: 0.0
    ngram_n: 2
    compute_bleu: true
    compute_bertscore: true

loss_fn:
  _target_: chemgfn.models.losses.SubTBLoss

reward_config:
  diversity_metric: "sequence_embedding"
  diversity_model_name: "sentence-transformers/all-mpnet-base-v2"

reward_buffer:
  _target_: chemgfn.utils.replay_buffer.ReplayBuffer
  buffer_size: 200

constraint_config:
  min_sentence_len: 4
  max_sentence_len: 20
  # A sentence-final period terminates the trajectory.
  end_of_sentence_token: "."
  grammar_path: ${paths.assets_dir}/text_grammars/free.ebnf
  disable_grammar: true
  processor_type: "prefix"
  legal_tokens: null
  illegal_tokens: ["<|begin_of_text|>", "<|end_of_text|>"]
  parse_mode: "limited"

training_mixed_config:
  pf_temp_high: 1.5
  pf_temp_low: 0.8
  pf_temp_prob: 0.666
  pf_temp_eval: 1.0
  n_samples: 8
  buffer_mixture_ratio: 0.5
  grammar_disagree_penalty: ${model.reward.grammar_disagree_penalty}

factor_schedulers:
  reward_temp:
    _target_: chemgfn.utils.schedulers.Scheduler
    schedule_type: "linear"
    start: 1.5
    end: 1.0
    horizon: 50000
  replay_buffer:
    _target_: chemgfn.utils.schedulers.Scheduler
    schedule_type: "linear"
    start: 0.25
    end: 0.5
    horizon: 50000
  dataset_buffer:
    _target_: chemgfn.utils.schedulers.Scheduler
    schedule_type: "linear"
    start: 0
    end: 0
    horizon: 50000
  reference_logits_scale:
    _target_: chemgfn.utils.schedulers.Scheduler
    schedule_type: "linear"
    start: 1.0
    end: 1.0
    horizon: 50000
  scaling_factor:
    _target_: chemgfn.utils.schedulers.Scheduler
    schedule_type: "linear"
    start: 8
    end: 8
    horizon: 5000

disable_peft: false
