_target_: chemgfn.models.gfn.ChemGFNModule

lora_config:
  _target_: peft.LoraConfig
  target_modules: ["c_attn"]
  r: 32
  lora_alpha: 32
  lora_dropout: 0.1
  bias: "none"
  fan_in_fan_out: false

# bnb_config:
#   _target_: transformers.BitsAndBytesConfig
#   load_in_8bit: true

net:
  _target_: transformers.AutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: "openai-community/gpt2"

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.001
  weight_decay: 0.01

# If use bnb, plz use
# _target_: bitsandbytes.optim.PagedAdamW8bit

scheduler:
  _target_: torch.optim.lr_scheduler.PolynomialLR
  _partial_: true
  total_iters: 10
  power: 1.0

reward:
  _target_: chemgfn.models.reward.FrozenModelSentenceGivenPrompt
  temperature: 1.0
  valid_sentence_alpha: 1.0
  sentence_validator:
    _target_: chemgfn.models.reward.NumberValidator

reward_config:
  reward_temp_start: 1.0
  reward_temp_end: 0.8
  reward_temp_horizon: 10000

reward_buffer:
  _target_: chemgfn.utils.gfn_utils.ReplayBuffer
  buffer_size: 50
  sim_tolerance: 0.25

constraint_config:
  min_sentence_len: 10
  max_sentence_len: 20
  grammar_path: ${paths.assets_dir}/number_grammars/odd_even.ebnf
  apply_grammar: false
  legal_tokens: ${paths.assets_dir}/token_list/number/allowed_gpt2_token
  vocab_alpha: "-inf"

training_mixed_config:
  subtb_lambda: 1.0
  pf_temp_high: 2.0
  pf_temp_low: 0.5
  pf_temp_prob: 0.666
  use_buffer_prob: 0.25
  n_samples: 4

compile: false
