_target_: chemgfn.models.gfn.ChemGFNModule

lora_config:
  _target_: peft.LoraConfig
  target_modules: ["q_proj", "k_proj"]
  r: 16
  task_type: "CAUSAL_LM"
  lora_alpha: 16
  lora_dropout: 0.1
  inference_mode: false
  bias: "none"
  fan_in_fan_out: true

# bnb_config:
#   _target_: transformers.BitsAndBytesConfig
#   load_in_8bit: true

net_config:
  pretrained_model_name_or_path: "EleutherAI/gpt-j-6b"

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.001
  weight_decay: 0.01

tokenizer:
  _target_: transformers.AutoTokenizer.from_pretrained
  pretrained_model_name_or_path: "EleutherAI/gpt-j-6b"

scheduler:
  _target_: torch.optim.lr_scheduler.PolynomialLR
  _partial_: true
  total_iters: 10
  power: 1.0

reward:
  _target_: chemgfn.models.reward.FrozenModelSentenceGivenPrompt
  temperature: 1.0
  valid_sentence_alpha: 1.0
  invalid_start_ratio: 0.2
  invalid_end_ratio: 1.2
  sentence_validator:
    _target_: chemgfn.models.reward.RDKitValidator

reward_config:
  reward_temp_start: 2
  reward_temp_end: 0.8
  reward_temp_horizon: 50000
  illegal_vocab_penalty: -80

reward_buffer:
  _target_: chemgfn.utils.gfn_utils.ReplayBuffer
  buffer_size: 50
  sim_tolerance: 0.25

constraint_config:
  min_sentence_len: 10
  max_sentence_len: 20
  grammar_path: ${paths.assets_dir}/SMILES_grammars/generic.ebnf
  apply_grammar: true
  processor_type: "prefix"
  legal_tokens: ${paths.assets_dir}/token_list/SMILES/allowed_gptj_6B_token
  illegal_vocab_penalty: -50
  parse_mode: "limited"

training_mixed_config:
  subtb_lambda: 1.0
  pf_temp_high: 2.0
  pf_temp_low: 0.5
  pf_temp_prob: 0.666
  use_buffer_prob: 0.25
  n_samples: 8

compile: false
