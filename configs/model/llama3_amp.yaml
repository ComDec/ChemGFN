_target_: chemgfn.models.gfn.ChemGFNModule

lora_config:
  _target_: peft.LoraConfig
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "down_proj", "up_proj"]
  r: 16
  lora_alpha: 16
  lora_dropout: 0.1
  bias: "none"
  fan_in_fan_out: false

net_config:
  pretrained_model_name_or_path: "meta-llama/Llama-3.2-1B"

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001
  weight_decay: 0.01

tokenizer:
  _target_: transformers.AutoTokenizer.from_pretrained
  pretrained_model_name_or_path: ${model.net_config.pretrained_model_name_or_path}

scheduler:
  _target_: torch.optim.lr_scheduler.PolynomialLR
  _partial_: true
  total_iters: 100000
  power: 1.0

loss_fn:
  _target_: chemgfn.models.losses.TBLoss

reward:
  _target_: chemgfn.models.reward.AbsorbingPrefixReward
  illegal_vocab_penalty: 0
  grammar_disagree_penalty: 0
  score_function: "score_fast"
  sentence_validator:
    _target_: chemgfn.models.validators.AMPValidator
    oracle_weights_path: ${paths.data_dir}AMP/oracle_weights.pt
    oracle_device: "cuda"
    mc_samples: 0
    training_set_path: ${paths.data_dir}AMP/training_sequences.txt
    topk: 100

# Reward-side settings. AMP uses edit-distance diversity, so no sequence-embedding
# diversity model is configured.
reward_config: {}

reward_buffer:
  _target_: chemgfn.utils.replay_buffer.ReplayBuffer
  buffer_size: 200

constraint_config:
  min_sentence_len: 5
  max_sentence_len: 50
  grammar_path: ${paths.assets_dir}/protein_grammars/amp.ebnf
  disable_grammar: false
  processor_type: "prefix"
  legal_tokens: ${paths.assets_dir}/token_list/protein/allowed_llama3.2_1B_amino_acid
  parse_mode: "limited"

training_mixed_config:
  pf_temp_high: 1.0
  pf_temp_low: 1.0
  pf_temp_prob: 0.666
  n_samples: 32
  buffer_mixture_ratio: 0.7
  grammar_disagree_penalty: ${model.reward.grammar_disagree_penalty}

factor_schedulers:
  reward_temp:
    _target_: chemgfn.utils.schedulers.Scheduler
    schedule_type: "linear"
    start: 1
    end: 1
    horizon: 50000
  replay_buffer:
    _target_: chemgfn.utils.schedulers.Scheduler
    schedule_type: "linear"
    start: 0.50
    end: 0.25
    horizon: 50000
  dataset_buffer:
    _target_: chemgfn.utils.schedulers.Scheduler
    schedule_type: "linear"
    start: 0.75
    end: 0.25
    horizon: 25000
  reference_logits_scale:
    _target_: chemgfn.utils.schedulers.Scheduler
    schedule_type: "linear"
    start: 1
    end: 1.0
    horizon: 50000
  pf_temp_low:
    _target_: chemgfn.utils.schedulers.Scheduler
    schedule_type: "linear"
    start: 0.8
    end: 1.0
    horizon: 50000
  pf_temp_high:
    _target_: chemgfn.utils.schedulers.Scheduler
    schedule_type: "linear"
    start: 1.5
    end: 1.0
    horizon: 50000
  scaling_factor:
    _target_: chemgfn.utils.schedulers.Scheduler
    schedule_type: "linear"
    start: 50
    end: 50
    horizon: 10000

disable_peft: false
