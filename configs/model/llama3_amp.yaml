_target_: chemgfn.models.gfn.ChemGFNModule

lora_config:
  _target_: peft.LoraConfig
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "down_proj", "up_proj"]
  r: 16
  lora_alpha: 16
  lora_dropout: 0.1
  bias: "none"
  fan_in_fan_out: false

net_config:
  pretrained_model_name_or_path: "meta-llama/Llama-3.2-1B"

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001
  weight_decay: 0.01

tokenizer:
  _target_: transformers.AutoTokenizer.from_pretrained
  pretrained_model_name_or_path: ${model.net_config.pretrained_model_name_or_path}

scheduler:
  _target_: torch.optim.lr_scheduler.PolynomialLR
  _partial_: true
  total_iters: 100000
  power: 1.0

loss_fn:
  _target_: chemgfn.models.losses.LLMTrajectoryBalanceLoss
  subtb_lambda: 1.0
  eps: 1e-8

ema_config:
  enabled: false
  decay: 0.999
  ema_start_epoch: 0
  reference_start_epoch: 0
  reference_update_interval: 1

reward:
  _target_: chemgfn.models.reward.Reference_Target_Score_Positive_Memory_PrefixShaping_NoBackoff
  disable_peft: ${model.disable_peft}
  illegal_vocab_penalty: 0
  grammar_disagree_penalty: 0
  phi_weight: 0
  reward_strategy: "smiles_absorbing"
  smiles_len_weight: 0.0
  smiles_score_clip: [0.0, 1.0]
  pv_update_strategy: smiles_global_score
  use_entropy_gate: false
  use_token_entropy_gate: false
  ent_lo: 0.10
  ent_hi: 0.55
  phi_eta: 1.0
  phi_clamp: 2.0
  pv_split: 2
  pv_split_inclusive: true
  pv_memory_kwargs:
    alpha: 1.0
    gamma: 0.999
    max_keys: 500000
    prune_every: 200
    prune_threshold: 1.0
    tau_conf: 20.0
  score_function: "score_fast"
  sentence_validator:
    _target_: chemgfn.models.validators.AMPValidator
    oracle_weights_path: ${paths.data_dir}AMP/oracle_weights.pt
    oracle_device: "cuda"
    mc_samples: 0
    training_set_path: ${paths.data_dir}AMP/training_sequences.txt
    topk: 100

reward_config:
  reward_temp_start: 1
  reward_temp_end: 1
  reward_temp_horizon: 50000
  scaling_factor_start: 50
  scaling_factor_end: 50
  scaling_factor_horizon: 50000

reward_buffer:
  _target_: chemgfn.utils.gfn_utils.ReplayBuffer
  prioritized_replay: True
  buffer_size: 200
  sim_tolerance: 0.25
  strict_mode: false
  buffer_aug_value: 0

constraint_config:
  min_sentence_len: 15
  max_sentence_len: 50
  grammar_path: ${paths.assets_dir}/protein_grammars/amp.ebnf
  disable_grammar: false
  processor_type: "prefix"
  legal_tokens: ${paths.assets_dir}/token_list/protein/allowed_llama3.2_1B_amino_acid
  illegal_vocab_penalty: -50
  parse_mode: "limited"

training_mixed_config:
  subtb_lambda: 1.0
  pf_temp_high: 1.0
  pf_temp_low: 1.0
  pf_temp_prob: 0.666
  n_samples: 32
  buffer_mixture_ratio: 0.7
  skip_baseline_sampling: true
  opt_task: false
  grammar_disagree_penalty: ${model.reward.grammar_disagree_penalty}

factor_schedulers:
  reward_temp:
    _target_: chemgfn.models.gfn.Scheduler
    schedule_type: "linear"
    start: 1
    end: 1
    horizon: 50000
  replay_buffer:
    _target_: chemgfn.models.gfn.Scheduler
    schedule_type: "linear"
    start: 0.50
    end: 0.25
    horizon: 50000
  dataset_buffer:
    _target_: chemgfn.models.gfn.Scheduler
    schedule_type: "linear"
    start: 0.75
    end: 0.25
    horizon: 25000
  reference_logits_scale:
    _target_: chemgfn.models.gfn.Scheduler
    schedule_type: "linear"
    start: 1
    end: 1.0
    horizon: 50000
  pf_temp_low:
    _target_: chemgfn.models.gfn.Scheduler
    schedule_type: "linear"
    start: 0.8
    end: 1.0
    horizon: 50000
  pf_temp_high:
    _target_: chemgfn.models.gfn.Scheduler
    schedule_type: "linear"
    start: 1.5
    end: 1.0
    horizon: 50000
  scaling_factor:
    _target_: chemgfn.models.gfn.Scheduler
    schedule_type: "linear"
    start: 50
    end: 50
    horizon: 10000
  alpha_reference:
    _target_: chemgfn.models.gfn.Scheduler
    schedule_type: "linear"
    start: 0.0
    end: 0.0
    horizon: 50000

compile: false
disable_peft: false
