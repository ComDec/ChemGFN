_target_: chemgfn.models.gfn.ChemGFNModule

net:
  _target_: chemgfn.models.components.Llama3Model
  model_name: "meta-llama/Meta-Llama-3-8B-Instruct"
  use_bnb: false
  bnb_config:
    _target_: transformers.BitsAndBytesConfig
    load_in_8bit: true
  lora_config:
    _target_: peft.LoraConfig
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "down_proj", "up_proj"]
    r: 64
    lora_alpha: 16
    lora_dropout: 0.1
    bias: "none"
    fan_in_fan_out: True

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001
  weight_decay: 0.01

# If use bnb, plz use
# _target_: bitsandbytes.optim.PagedAdamW8bit

scheduler:
  _target_: torch.optim.lr_scheduler.PolynomialLR
  _partial_: true
  total_iters: 10
  power: 1.0

reward:
  _target_: chemgfn.models.reward.FrozenModelSentenceGivenPrompt
  temperature: 1.0
  min_len: 1
  vocab_alpha: 1.0
  vocab_nice_mask: null
  vocab_naughty_mask: null
  valid_sentence_alpha: 1.0
  sentence_validator:
    _target_: chemgfn.models.reward.RDKitValidator

reward_config:
  temp_start: 1.0
  temp_end: 0.8
  temp_horizon: 10000

reward_buffer:
  _target_: chemgfn.utils.gfn_utils.ReplayBuffer
  buffer_size: 50
  sim_tolerance: 0.25

constraint_config:
  min_sentence_len: 1
  max_sentence_len: 100

training_mixed_config:
  subtb_lambda: 1.0
  pf_temp_high: 2.0
  pf_temp_low: 0.5
  pf_temp_prob: 0.666
  use_buffer_prob: 0.25
  n_samples: 20

compile: false
