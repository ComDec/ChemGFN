_target_: chemgfn.models.gfn.ChemGFNModule

lora_config:
  _target_: peft.LoraConfig
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "down_proj", "up_proj"]
  r: 16
  lora_alpha: 16
  lora_dropout: 0.1
  bias: "none"
  fan_in_fan_out: false

net_config:
  pretrained_model_name_or_path: "meta-llama/Llama-3.1-8B"

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001
  weight_decay: 0.01

tokenizer:
  _target_: transformers.AutoTokenizer.from_pretrained
  pretrained_model_name_or_path: ${model.net_config.pretrained_model_name_or_path}

scheduler:
  _target_: torch.optim.lr_scheduler.PolynomialLR
  _partial_: true
  total_iters: 100000
  power: 1.0

loss_fn:
  _target_: chemgfn.models.losses.ModifiedSubTBLoss
  subtb_lambda: 1.0
  eps: 1e-8

ema_config:
  enabled: false
  decay: 0.999
  ema_start_epoch: 0
  reference_start_epoch: 0
  reference_update_interval: 1

reward:
  _target_: chemgfn.models.reward.Reference_Target_Score_Positive_Mixed_Invalid_Mask_PrefixShaping
  invalid_start_ratio: 0.2
  invalid_end_ratio: 1.2
  disable_peft: ${model.disable_peft}
  illegal_vocab_penalty: 0
  grammar_disagree_penalty: 0
  phi_weight: 0
  score_function: "score_fast"
  sentence_validator:
    _target_: chemgfn.models.validators.RDKitValidator
    scorer: "logP"
    backend: "pa"

reward_config:
  reward_temp_start: 2
  reward_temp_end: 0.8
  reward_temp_horizon: 50000
  scaling_factor_start: 50
  scaling_factor_end: 50
  scaling_factor_horizon: 50000

reward_buffer:
  _target_: chemgfn.utils.gfn_utils.ReplayBuffer
  buffer_size: 200
  sim_tolerance: 0.25

constraint_config:
  min_sentence_len: 2
  max_sentence_len: 10
  grammar_path: ${paths.assets_dir}/SMILES_grammars/generic.ebnf
  apply_grammar: true
  processor_type: "prefix"
  legal_tokens: ${paths.assets_dir}/token_list/SMILES/allowed_llama3.2_1B_allowed_token
  illegal_vocab_penalty: -50
  parse_mode: "full"

training_mixed_config:
  subtb_lambda: 1.0
  pf_temp_high: 2.0
  pf_temp_low: 0.5
  pf_temp_prob: 0.666
  n_samples: 8
  buffer_mixture_ratio: 0.7
  skip_baseline_sampling: true
  opt_task: true

factor_schedulers:
  reward_temp:
    _target_: chemgfn.models.gfn.Scheduler
    schedule_type: "linear"
    start: 2
    end: 0.8
    horizon: 50000
  replay_buffer:
    _target_: chemgfn.models.gfn.Scheduler
    schedule_type: "linear"
    start: 0.2
    end: 0.5
    horizon: 50000
  dataset_buffer:
    _target_: chemgfn.models.gfn.Scheduler
    schedule_type: "linear"
    start: 0.8
    end: 0.1
    horizon: 50000
  alpha_reference:
    _target_: chemgfn.models.gfn.Scheduler
    schedule_type: "linear"
    start: 0.0
    end: 0.0
    horizon: 50000
  reference_logits_scale:
    _target_: chemgfn.models.gfn.Scheduler
    schedule_type: "linear"
    start: 0.0
    end: 0.0
    horizon: 50000
  scaling_factor:
    _target_: chemgfn.models.gfn.Scheduler
    schedule_type: "linear"
    start: 1
    end: 1
    horizon: 5000

compile: false
disable_peft: false
