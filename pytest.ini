[pytest]
# Pytest configuration for ChemGFN

# Minimum version
minversion = 6.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Strict markers
    --strict-markers
    # Warnings
    -W ignore::DeprecationWarning
    -W ignore::PendingDeprecationWarning
    # Coverage (if pytest-cov is installed)
    # --cov=chemgfn
    # --cov-report=html
    # --cov-report=term-missing

# Markers for categorizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    gpu: marks tests requiring GPU (deselect with '-m "not gpu"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    requires_model: marks tests that require model download

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (if pytest-timeout is installed)
# timeout = 300

# Parallel execution (if pytest-xdist is installed)
# -n auto

# Doctest
# doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS

# Filterwarnings
filterwarnings =
    ignore::UserWarning
    ignore::FutureWarning
